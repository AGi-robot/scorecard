<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How AIVA / Grace Works — An Interactive Explainer</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #1a1d27;
    --panel2: #222632;
    --accent: #6c8aff;
    --accent2: #ff8a6c;
    --accent3: #6cffc8;
    --accent4: #e08aff;
    --text: #e8eaf0;
    --text2: #a0a4b4;
    --border: #2d3140;
    --success: #4ade80;
    --warning: #fbbf24;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 1rem;
  }

  header {
    text-align: center;
    padding: 1.5rem 0 1rem;
  }

  header h1 {
    font-size: 1.8rem;
    background: linear-gradient(135deg, var(--accent), var(--accent4));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 0.25rem;
  }

  header .subtitle {
    color: var(--text2);
    font-size: 0.95rem;
  }

  .disclaimer {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    background: var(--panel);
    border: 1px solid var(--warning);
    border-radius: 20px;
    padding: 0.3rem 0.8rem;
    font-size: 0.75rem;
    color: var(--warning);
    margin-top: 0.5rem;
  }

  /* Controls Bar */
  .controls-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    padding: 0.75rem;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin: 1rem 0;
  }

  #step-label {
    font-size: 1rem;
    font-weight: 600;
    color: var(--accent);
    min-width: 280px;
    text-align: center;
    padding: 0.4rem 0;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    padding: 0.5rem 1.1rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel2);
    color: var(--text);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    min-width: 80px;
    user-select: none;
  }

  .btn:hover { border-color: var(--accent); background: #2a2e3e; }
  .btn:active { transform: scale(0.97); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #0f1117; }
  .btn.primary:hover { background: #8aa4ff; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .step-dots {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--border);
    transition: all 0.3s;
  }

  .dot.active { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .dot.done { background: var(--success); }

  /* Main Stage */
  .stage-wrapper {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    margin: 1rem 0;
  }

  .stage {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    min-height: 400px;
  }

  .stage svg {
    width: 100%;
    height: 100%;
  }

  /* Stage panels for each step */
  .stage-panel {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }

  .stage-panel.active {
    opacity: 1;
    pointer-events: auto;
  }

  /* Info panel */
  .info-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.25rem;
    margin: 1rem 0;
  }

  .info-panel h3 {
    font-size: 1rem;
    color: var(--accent3);
    margin-bottom: 0.5rem;
  }

  .info-panel .fact-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 0.5rem;
  }

  .fact-item {
    display: flex;
    gap: 0.5rem;
    align-items: flex-start;
    font-size: 0.82rem;
    color: var(--text2);
    line-height: 1.4;
  }

  .fact-item .icon {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    margin-top: 1px;
  }

  /* Optional capabilities */
  .optional-area {
    background: var(--panel);
    border: 1px dashed var(--border);
    border-radius: 12px;
    padding: 1rem 1.25rem;
    margin: 1rem 0;
  }

  .optional-area h3 {
    font-size: 0.95rem;
    color: var(--accent4);
    margin-bottom: 0.5rem;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .optional-area .badge {
    font-size: 0.65rem;
    background: var(--panel2);
    border: 1px solid var(--border);
    padding: 0.1rem 0.4rem;
    border-radius: 4px;
    color: var(--text2);
  }

  .optional-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 0.75rem;
  }

  .opt-card {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem;
    font-size: 0.8rem;
    color: var(--text2);
    line-height: 1.4;
  }

  .opt-card h4 {
    color: var(--text);
    font-size: 0.85rem;
    margin-bottom: 0.25rem;
  }

  .opt-card .sep {
    color: var(--text2);
    font-style: italic;
  }

  /* Animation elements */
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
  @keyframes slideRight { 0% { transform: translateX(0); } 100% { transform: translateX(30px); } }
  @keyframes slideLeft { 0% { transform: translateX(0); } 100% { transform: translateX(-30px); } }
  @keyframes blink { 0%, 90%, 100% { opacity: 1; } 95% { opacity: 0.3; } }
  @keyframes typeLine { 0% { width: 0; } 100% { width: 100%; } }
  @keyframes envelopeMove { 0% { transform: translateX(0); } 50% { transform: translateX(15px); } 100% { transform: translateX(0); } }
  @keyframes glowPulse { 0%, 100% { filter: drop-shadow(0 0 3px currentColor); } 50% { filter: drop-shadow(0 0 10px currentColor); } }
  @keyframes streamDelta { 0% { opacity: 0; transform: translateY(4px); } 100% { opacity: 1; transform: translateY(0); } }

  .anim-float { animation: float 3s ease-in-out infinite; }
  .anim-pulse { animation: pulse 1.5s ease-in-out infinite; }
  .anim-blink { animation: blink 2s ease-in-out infinite; }

  /* Chat stream simulation */
  .chat-stream {
    font-family: 'Courier New', monospace;
    font-size: 0.75rem;
    color: var(--accent3);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.5rem 0.75rem;
    max-width: 400px;
    margin: 0.5rem auto;
    line-height: 1.5;
  }

  .chat-stream .delta {
    display: inline-block;
    animation: streamDelta 0.3s ease-out forwards;
  }

  /* Responsive */
  @media (max-width: 768px) {
    header h1 { font-size: 1.3rem; }
    #step-label { font-size: 0.85rem; min-width: auto; }
    .btn { padding: 0.4rem 0.8rem; min-width: 65px; font-size: 0.78rem; }
    .stage { aspect-ratio: 4 / 3; min-height: 300px; }
    .info-panel .fact-grid { grid-template-columns: 1fr; }
  }

  @media (max-width: 480px) {
    .container { padding: 0.5rem; }
    .stage { aspect-ratio: 1 / 1.1; min-height: 260px; }
    .controls-bar { gap: 0.4rem; padding: 0.5rem; }
  }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }

  footer {
    text-align: center;
    padding: 1rem;
    color: var(--text2);
    font-size: 0.75rem;
    border-top: 1px solid var(--border);
    margin-top: 1rem;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>How AIVA / Grace Works</h1>
    <p class="subtitle">An interactive, cartoon walkthrough of the current architecture</p>
    <div class="disclaimer">⚠️ SIMULATION — not live telemetry</div>
  </header>

  <!-- Controls -->
  <div class="controls-bar" role="toolbar" aria-label="Animation controls">
    <button class="btn" id="reset" type="button" aria-label="Reset to step 0">⟲ Reset</button>
    <button class="btn primary" id="play" type="button" aria-label="Play or pause automatic advancement">▶ Play</button>
    <button class="btn" id="next" type="button" aria-label="Advance to next step">Next ▸</button>
    <div class="step-dots" aria-label="Step indicators" role="presentation">
      <span class="dot active" data-step="0"></span>
      <span class="dot" data-step="1"></span>
      <span class="dot" data-step="2"></span>
      <span class="dot" data-step="3"></span>
      <span class="dot" data-step="4"></span>
      <span class="dot" data-step="5"></span>
      <span class="dot" data-step="6"></span>
    </div>
    <div id="step-label" role="status" aria-live="polite">Step 0 · The User types a message at the Console</div>
  </div>

  <!-- Main Stage -->
  <div class="stage-wrapper">
    <div class="stage" id="stage" role="img" aria-labelledby="step-label">
      <svg viewBox="0 0 1000 562" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
        <defs>
          <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#1a1d27"/>
            <stop offset="100%" stop-color="#0f1117"/>
          </linearGradient>
          <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#6c8aff"/>
            <stop offset="100%" stop-color="#a08aff"/>
          </linearGradient>
          <linearGradient id="orangeGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#ff8a6c"/>
            <stop offset="100%" stop-color="#ffb088"/>
          </linearGradient>
          <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#6cffc8"/>
            <stop offset="100%" stop-color="#88ffd8"/>
          </linearGradient>
          <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#e08aff"/>
            <stop offset="100%" stop-color="#f0b0ff"/>
          </linearGradient>
          <marker id="arrowHead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
            <path d="M0,0 L8,4 L0,8 Z" fill="#4a5068"/>
          </marker>
          <marker id="arrowHeadActive" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
            <path d="M0,0 L8,4 L0,8 Z" fill="#6c8aff"/>
          </marker>
        </defs>

        <!-- Background -->
        <rect width="1000" height="562" fill="url(#bgGrad)"/>

        <!-- Grid lines (subtle) -->
        <g stroke="#1e2230" stroke-width="1">
          <line x1="0" y1="140" x2="1000" y2="140"/>
          <line x1="0" y1="280" x2="1000" y2="280"/>
          <line x1="0" y1="420" x2="1000" y2="420"/>
          <line x1="250" y1="0" x2="250" y2="562"/>
          <line x1="500" y1="0" x2="500" y2="562"/>
          <line x1="750" y1="0" x2="750" y2="562"/>
        </g>

        <!-- ===== PATH LINE (always visible, dim) ===== -->
        <g id="pathLine">
          <path d="M 120 280 L 880 280" stroke="#2d3140" stroke-width="4" stroke-dasharray="8,6" fill="none" marker-end="url(#arrowHead)"/>
        </g>

        <!-- ===== STAGE 0: USER + CONSOLE ===== -->
        <g id="stage0" class="stage-group" opacity="0.3">
          <!-- Desk -->
          <rect x="40" y="340" width="200" height="12" rx="2" fill="#3a3f50"/>
          <rect x="50" y="352" width="8" height="60" fill="#2d3140"/>
          <rect x="222" y="352" width="8" height="60" fill="#2d3140"/>
          <!-- Person (cartoon) -->
          <g class="anim-float" style="transform-origin: 120px 200px;">
            <!-- Body -->
            <path d="M 95 280 Q 95 240 120 235 Q 145 240 145 280 Z" fill="#4a6fa5"/>
            <!-- Head -->
            <circle cx="120" cy="210" r="28" fill="#f0c8a0"/>
            <!-- Hair -->
            <path d="M 92 195 Q 92 175 120 175 Q 148 175 148 195 Q 148 185 140 182 Q 120 178 100 182 Q 92 185 92 195 Z" fill="#5a4030"/>
            <!-- Eyes -->
            <circle cx="108" cy="210" r="3" fill="#333"/>
            <circle cx="132" cy="210" r="3" fill="#333"/>
            <!-- Smile -->
            <path d="M 110 222 Q 120 230 130 222" stroke="#c08060" stroke-width="2" fill="none" stroke-linecap="round"/>
            <!-- Arms -->
            <path d="M 98 260 Q 80 270 85 290" stroke="#f0c8a0" stroke-width="6" fill="none" stroke-linecap="round"/>
            <path d="M 142 260 Q 160 270 155 290" stroke="#f0c8a0" stroke-width="6" fill="none" stroke-linecap="round"/>
          </g>
          <!-- Monitor (Console UI) -->
          <rect x="150" y="250" width="120" height="80" rx="4" fill="#1a1d27" stroke="#4a6fa5" stroke-width="2"/>
          <rect x="156" y="256" width="108" height="56" rx="2" fill="#0f1117"/>
          <!-- Console text lines -->
          <rect x="162" y="264" width="60" height="4" rx="1" fill="#6c8aff" opacity="0.8"/>
          <rect x="162" y="274" width="80" height="4" rx="1" fill="#6c8aff" opacity="0.5"/>
          <rect x="162" y="284" width="45" height="4" rx="1" fill="#6c8aff" opacity="0.6"/>
          <rect x="162" y="294" width="70" height="4" rx="1" fill="#6cffc8" opacity="0.6"/>
          <!-- Stand -->
          <rect x="195" y="330" width="30" height="10" fill="#3a3f50"/>
          <!-- Label -->
          <text x="210" y="380" text-anchor="middle" fill="#a0a4b4" font-size="11" font-family="sans-serif">Console</text>
          <text x="120" y="380" text-anchor="middle" fill="#a0a4b4" font-size="11" font-family="sans-serif">You</text>
        </g>

        <!-- ===== STAGE 1: ENCODE + ROSBRIDGE ===== -->
        <g id="stage1" class="stage-group" opacity="0.3">
          <!-- Console box (highlighted) -->
          <rect x="260" y="230" width="140" height="100" rx="8" fill="#1a1d27" stroke="#6c8aff" stroke-width="2.5"/>
          <text x="330" y="255" text-anchor="middle"
