<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIVA/Grace Architecture Visualization</title>
<style>
    :root {
        --bg: #0f172a;
        --card-bg: #1e293b;
        --text: #e2e8f0;
        --text-secondary: #94a3b8;
        --accent: #38bdf8;
        --accent-glow: rgba(56, 189, 248, 0.2);
        --success: #34d399;
        --warning: #fbbf24;
        --danger: #f87171;
        --border: #334155;
        --font: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
    }

    /* --- Header --- */
    header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1rem 2rem;
        border-bottom: 1px solid var(--border);
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(10px);
        z-index: 10;
    }
    h1 { font-size: 1.25rem; margin: 0; letter-spacing: -0.02em; }
    h1 span { color: var(--accent); }
    .status-bar { font-size: 0.85rem; color: var(--text-secondary); font-family: monospace; }

    /* --- Main Layout --- */
    main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        position: relative;
    }

    /* SVG Container */
    #viz-container {
        width: 100%;
        max-width: 900px;
        height: 400px;
        background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        border: 1px solid var(--border);
        border-radius: 1rem;
        box-shadow: 0 4px 24px rgba(0,0,0,0.5);
        position: relative;
        overflow: hidden;
    }
    svg { width: 100%; height: 100%; display: block; }

    /* --- Controls --- */
    .controls {
        display: flex;
        gap: 1rem;
        margin-bottom: 1rem;
        z-index: 20;
    }
    button {
        padding: 0.6rem 1.2rem;
        border: 1px solid var(--border);
        background: var(--card-bg);
        color: var(--text);
        border-radius: 0.5rem;
        font-size: 0.9rem;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.2s;
        font-family: var(--font);
    }
    button:hover {
        border-color: var(--accent);
        background: rgba(56, 189, 248, 0.1);
        transform: translateY(-1px);
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    #play-btn { border-color: var(--accent); color: var(--accent); }
    #play-btn:hover { background: var(--accent-glow); }

    /* --- Step Label --- */
    #step-label {
        display: inline-block;
        margin-bottom: 0.5rem;
        font-size: 0.9rem;
        color: var(--accent);
        font-weight: 700;
        letter-spacing: 0.05em;
    }

    /* --- Log Area --- */
    .log-area {
        width: 100%;
        max-width: 600px;
        height: 60px;
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        padding: 0.8rem 1rem;
        font-family: 'Courier New', Courier, monospace;
        font-size: 0.85rem;
        color: var(--text-secondary);
        overflow-y: auto;
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-content: flex-start;
        line-height: 1.5;
    }
    .log-entry {
        animation: fadeIn 0.3s ease;
    }
    .log-entry.highlight { color: var(--accent); }

    /* --- Footer / Optional --- */
    .footer-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 2rem;
        justify-content: center;
        padding-top: 1rem;
        margin-top: 0.5rem;
        font-size: 0.75rem;
        color: var(--text-secondary);
    }
    .legend-item { display: flex; align-items: center; gap: 0.4rem; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        .log-area { overflow: visible; }
    }
</style>
</head>
<body>

<header>
    <h1>AIVA <span>&amp;</span> Grace</h1>
    <div class="status-bar" id="status-bar">Ready</div>
</header>

<main>
    <div id="step-label" style="display:none;">STEP 0/6</div>

    <div id="viz-container">
        <svg id="architecture-svg" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <filter id="glow">
                    <feGaussianBlur stdDeviation="3" result="blur" />
                    <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic"/></feMerge>
                </filter>
                <filter id="softGlow">
                    <feGaussianBlur stdDeviation="4" />
                </filter>
                <linearGradient id="grad1" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
                    <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
                </linearGradient>
            </defs>
            <g id="animation-layer"></g>
        </svg>
    </div>

    <div class="controls">
        <button id="reset-btn">Reset</button>
        <button id="next-btn">Next Step</button>
        <button id="play-btn">▶ Play Demo</button>
    </div>

    <div class="log-area" id="log-area">
        <span style="color:#64748b">System ready. Press "Next Step" or "Play Demo" to begin.</span>
    </div>

    <div class="footer-legend">
        <div class="legend-item"><span class="dot" style="background:#38bdf8"></span> User Console</div>
        <div class="legend-item"><span class="dot" style="background:#f59e0b"></span> ROS / Network</div>
        <div class="legend-item"><span class="dot" style="background:#a855f7"></span> Receptor</div>
        <div class="legend-item"><span class="dot" style="background:#22c55e"></span> Interactive (Python)</div>
        <div class="legend-item"><span class="dot" style="background:#ef4444"></span> Router (llama.cpp)</div>
        <div class="legend-item"><span class="dot" style="background:#64748b"></span> Memory (SQLite)</div>
        <div class="legend-item" style="margin-left:auto"><span class="dot" style="background:#eab308"></span> Grace</div>
    </div>
</main>

<script>
    /**
     * AIVA DEMO ARCHITECTURE SIMULATION
     * Steps:
     * 0: User composes message
     * 1: Console encodes (Cypher) & pushes ROS
     * 2: Receptor decodes & hands to Interactive
     * 3: Interactive assembles Persona + Memory (SQLite)
     * 4: Interactive calls Router (llama.cpp)
     * 5: Response streams back to Console
     * 6: Memory saves exchange
     */

    // --- State ---
    const STATE = {
        step: 0,
        maxStep: 6,
        playing: false,
        intervalId: null,
        textStream: []
    };

    // --- DOM Elements ---
    const svg = document.getElementById('architecture-svg');
    const animLayer = document.getElementById('animation-layer');
    const stepLabel = document.getElementById('step-label');
    const logArea = document.getElementById('log-area');
    const nextBtn = document.getElementById('next-btn');
    const resetBtn = document.getElementById('reset-btn');
    const playBtn = document.getElementById('play-btn');
    const statusBar = document.getElementById('status-bar');

    // --- SVG Assets (Inline Paths) ---

    // 1. User
    const USER_PATH = "M40,80 C20,80 10,100 10,140 C10,180 20,220 40,240 L60,240 C80,220 90,180 90,140 C90,100 80,80 60,80 Z";
    const USER_FACE = "M45,130 Q55,110 65,130 Q55,150 45,130";
    const USER_BODY = "M10,140 L90,140 L85,240 L15,240 Z";

    // 2. Console
    const CONS_PATH = "M100,100 L250,100 L250,250 L100,250 Z";
    const CONS_SCREEN = "M110,110 L240,110 L235,240 L115,240 Z";

    // 3. Router
    const ROUTER_PATH = "M400,100 L420,100 L430,140 L420,160 L400,160 Z"; // Chip shape
    const ROUTER_BODY = "M380,100 L440,100 L430,160 L390,160 Z";

    // 4. Receptor
    const REC_PATH = "M550,100 L590,100 L620,140 L590,160 L550,160 Z";
    const REC_EAR = "M560,120 Q560,80 590,80 Q610,80 610,110 Q610,140 560,140";

    // 5. Interactive
    const INT_PATH = "M700,100 L750,100 L760,140 L750,160 L700,160 Z";
    const INT_BR = "M710,130 Q710,90 740,90 Q750,90 755,120 Q755,140 710,140";

    // 6. Memory
    const MEM_PATH = "M780,200 L810,200 L820,240 L810,280 L780,280 Z";
    const MEM_CYL = "M790,220 L800,220 L800,270 L780,270 Z";

    // 7. Grace
    const GRACE_PATH = "M380,280 L420,280 L430,320 L420,340 L380,340 Z";
    const GRACE_HEAD = "M390,300 Q400,260 420,260 Q430,260 430,300 Q430,320 390,320";

    // --- Helper: Draw SVG ---
    function drawNode(id, x, y, path, subPath, label, color) {
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.setAttribute("id", id);
        g.setAttribute("class", "node-group");
        g.style.transform = `translate(${x}px, ${y}px)`;
        
        const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        circle.setAttribute("r", 20);
        circle.setAttribute("fill", "transparent");
        circle.setAttribute("stroke", color);
        circle.setAttribute("stroke-width", 2);
        
        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("rx", 8);
        rect.setAttribute("fill", "#1e293b");
        rect.setAttribute("stroke", color);
        rect.setAttribute("stroke-width", 1.5);
        rect.setAttribute("width", "100");
        rect.setAttribute("height", "60");
        rect.setAttribute("x", -50);
        rect.setAttribute("y", 10);

        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("x", 0);
        text.setAttribute("y", 40);
        text.setAttribute("text-anchor", "middle");
        text.setAttribute("fill", "#e2e8f0");
        text.setAttribute("font-size", "10");
        text.setAttribute("font-weight", "bold");
        text.textContent = label;

        g.appendChild(circle);
        g.appendChild(rect);
        g.appendChild(text);
        svg.appendChild(g);
    }

    function initDrawing() {
        // Nodes
        drawNode("user", 100, 180, USER_PATH, USER_FACE, "User", "#38bdf8");
        drawNode("console", 280, 180, CONS_PATH, CONS_SCREEN, "Console", "#38bdf8");
        drawNode("ros", 360, 140, "M350,140 L380,140 L370,180 L350,180 Z", "", "ROS Bridge", "#f59e0b");
        drawNode("receptor", 550, 180, REC_PATH, REC_EAR, "Receptor", "#a855f7");
        drawNode("interactive", 700, 180, INT_PATH, INT_BR, "Interactive", "#22c55e");
        drawNode("router", 380, 300, ROUTER_PATH, "", "Router", "#ef4444");
        drawNode("memory", 780, 280, MEM_PATH, MEM_CYL, "Memory", "#64748b");
        drawNode("grace", 380, 340, GRACE_PATH, GRACE_HEAD, "Grace", "#eab308");
    }

    // --- Animation System ---
    let packetEl = null;

    function createPacket(currentX, currentY, duration) {
        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("rx", 4);
        rect.setAttribute("fill", "#38bdf8");
        rect.setAttribute("width", "16");
        rect.setAttribute("height", "16");
        rect.setAttribute("x", currentX);
        rect.setAttribute("y", currentY);
        rect.classList.add("packet");
        animLayer.appendChild(rect);
        return rect;
    }

    function removePacket(el) {
        if (el && el.parentNode) el.parentNode.removeChild(el);
    }

    function animatePacket(startX, startY, endX, endY, duration, easing) {
        return new Promise(resolve => {
            const p = createPacket(startX, startY, duration);
            // Store end coords on the element
            p.dataset.endX = endX;
            p.dataset.endY = endY;
            p.dataset.duration = duration;
            
            const key = "anim_" + Date.now();
            p.dataset.key = key;

            const durationMs = duration * 1000;
            const startTime = performance.now();

            function tick(currentTime) {
                const elapsed = (currentTime - startTime) / 1000;
                if (elapsed >= duration) {
                    removePacket(p);
                    resolve();
                    return;
                }
                // Ease
                const ease = easing(elapsed, 0, 1, duration);
                const currX = startX + (endX - startX) * ease;
                const currY = startY + (endY - startY) * ease;
                p.setAttribute("x", currX);
                p.setAttribute("y", currY);
                requestAnimationFrame(tick);
            }
            requestAnimationFrame(tick);
        });
    }

    function animateStep(step) {
        const log = document.createElement("span");
        log.className = "log-entry highlight";
        log.style.cssText = "margin-top:0.5rem";
        logArea.insertBefore(log, logArea.firstChild);

        const duration = 2000; // ms per step

        switch(step) {
            case 0:
                log.textContent = `User: "How does AIVA remember our conversation?"`;
                // Draw packet at User
                packetEl = animatePacket(100, 200, 280, 200, duration, t => 1 - Math.pow(1 - t, 1));
                break;

            case 1:
                log.textContent = `Console: Encoded Cypher signal via ROS Bridge.`;
                packetEl = animatePacket(280, 200, 360, 160, duration, t => 1 - Math.pow(1 - t, 1));
                break;

            case 2:
                log.textContent = `Receptor: Decoded & passed to Interactive.`;
                packetEl = animatePacket(360, 160, 550, 200, duration, t => 1 - Math.pow(1 - t, 1));
                break;

            case 3:
                log.textContent = `Interactive: Assembling Persona + SQLite Memory.`;
                // Draw packet to Interactive
                packetEl = animatePacket(550, 200, 700, 200, duration, t => 1 - Math.pow(1 - t, 1));
                break;

            case 4:
                log.textContent = `Router: llama.cpp (Nymphaea RP) streaming response...`;
                // Draw packet to Router
                packetEl = animatePacket(700, 200, 380, 300, duration, t => 1 - Math.pow(1 - t, 1));
                break;

            case 5:
                log.textContent = `Response streamed back to Console Display.`;
                // Return to Console
                packetEl = animatePacket(380, 300, 280, 200, duration, t => 1 - Math.pow(1 - t, 1));
                break;

            case 6:
                log.textContent = `Memory: Saved exchange. Grace is ready.`;
                // Return to Grace/Memory
                packetEl = animatePacket(280, 200, 380, 340, duration, t => 1 - Math.pow(1 - t, 1));
                break;
        }

        // Update UI
        stepLabel.style.display = 'block';
        stepLabel.textContent = `STEP ${step} / ${STATE.maxStep}`;
        statusBar.textContent = `Step: ${step}`;
    }

    function renderStep(step) {
        if (STATE.step === step) return;
        if (STATE.step > step) return; // Don't render future steps

        STATE.step = step;
        animateStep(step);

        // Update labels
        const labels = {
            0: "User Composing...",
            1: "Cypher Encoding...",
            2: "Decoding...",
            3: "Consulting Memory...",
            4: "Querying Router...",
            5: "Streaming Response...",
            6: "Saving to Memory..."
        };
        if(step === 0) stepLabel.style.display = 'none';
        else stepLabel.textContent = labels[step];
    }

    // --- API ---

    function reset() {
        stopPlayback();
        STATE.step = 0;
        STATE.playing = false;
        clearLog();
        logArea.innerHTML = '<span style="color:#64748b">System reset. Ready.</span>';
        renderStep(0);
        updateControls();
    }

    function next() {
        if (STATE.step < STATE.maxStep) {
            renderStep(STATE.step + 1);
            updateControls();
        }
    }

    function getState() {
        return { step: STATE.step, playing: STATE.playing };
    }

    function togglePlay() {
        if (STATE.playing) {
            stopPlayback();
        } else {
            startPlayback();
        }
    }

    function startPlayback() {
        if (STATE.step >= STATE.maxStep) return;
        STATE.playing = true;
        STATE.intervalId = setInterval(() => {
            if (STATE.step < STATE.maxStep) {
                renderStep(STATE.step + 1);
                updateControls();
            } else {
                stopPlayback();
                statusBar.textContent = "Demo Complete";
                nextBtn.disabled = true;
            }
        }, 2000);
    }

    function stopPlayback() {
        STATE.playing = false;
        if (STATE.intervalId) clearInterval(STATE.intervalId);
        STATE.intervalId = null;
        updateControls();
    }

    function clearLog() {
        logArea.innerHTML = '';
    }

    function updateControls() {
        nextBtn.disabled = STATE.step >= STATE.maxStep;
        if (!STATE.playing) {
            playBtn.textContent = "▶ Play Demo";
        } else {
            playBtn.textContent = "⏸ Pause";
        }
    }

    // --- Initialization ---
    initDrawing();
    updateControls();

    // Attach global API
    window.AIVA_DEMO = {
        reset,
        next,
        togglePlay,
        getState
    };

    // Event Listeners
    nextBtn.addEventListener('click', next);
    resetBtn.addEventListener('click', reset);
    playBtn.addEventListener('click', togglePlay);

    // Keyboard shortcut
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') next();
        if (e.key === 'r' || e.key === 'R') reset();
    });

</script>
</body>
</html>
